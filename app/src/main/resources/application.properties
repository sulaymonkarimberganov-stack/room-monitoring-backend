spring.application.name=app

# Server port
server.port=${PORT:8080}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# DataSource is configured programmatically in DatabaseConfig.java
# Dummy URL to prevent Spring Boot from complaining - actual URL set in DatabaseConfig
spring.datasource.url=jdbc:postgresql://localhost:5432/railway
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable Spring Boot auto DataSource to use our custom one
spring.datasource.hikari.maximum-pool-size=5

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT
jwt.secret=${JWT_SECRET:room-monitoring-secret-key-for-jwt-token-generation-minimum-256-bits}
jwt.expiration=86400000
