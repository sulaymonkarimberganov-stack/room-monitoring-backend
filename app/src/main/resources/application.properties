spring.application.name=app

# Server port
server.port=${PORT:8080}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Database - URL is set programmatically in AppApplication.java from DATABASE_URL env var
# This is just a placeholder - actual URL is set via System.setProperty before Spring starts
spring.datasource.url=jdbc:postgresql://localhost:5432/railway
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT
jwt.secret=${JWT_SECRET:room-monitoring-secret-key-for-jwt-token-generation-minimum-256-bits}
jwt.expiration=86400000
