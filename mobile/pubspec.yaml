name: room_monitoring
description: Xonalar tozaligi va xizmat buyumlari monitoring ilovasi
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  cupertino_icons: ^1.0.6
  glassmorphism: ^3.0.0
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  jwt_decoder: ^2.0.1
  fl_chart: ^0.69.0
  mobile_scanner: ^5.0.0
  image_picker: ^1.0.0
  permission_handler: ^11.0.0
  firebase_core: ^2.24.0
  firebase_messaging: ^14.7.9
  flutter_local_notifications: ^17.0.0
  intl: ^0.18.1
  package_info_plus: ^8.0.0
  lottie: ^3.0.0
  connectivity_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
